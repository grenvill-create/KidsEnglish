name: Deploy KidsEnglish to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'kidsenglish/**'
      - '.github/workflows/deploy-kidsenglish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ./kidsenglish
        run: npm install

      - name: Build
        working-directory: ./kidsenglish
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./kidsenglish/dist
